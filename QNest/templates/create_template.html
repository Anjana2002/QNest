{% extends "base.html" %}

{% block title %}Create Exam Template{% endblock %}

{% block content %}
    <h2>Create Exam Template</h2>
    
    <form method="POST" action="{% url 'create_template' %}">
        {% csrf_token %}

        <label>Template Name:</label>
        <input type="text" name="template_name" required><br>

        <label>Exam Title:</label>
        <input type="text" name="exam_title" required><br>

        <label>Course Code:</label>
        <input type="text" name="course_code" required><br>

        <label>Course Name:</label>
        <input type="text" name="course_name" required><br>

        <label>Time Duration:</label>
        <input type="text" name="time_duration" required><br>

        <label>Max Marks:</label>
        <input type="number" name="max_marks" required><br>

        <h3>Sections</h3>
        <div id="sections-container"></div>
        <button type="button" id="add-section-btn">Add Section</button><br><br>

        <button type="submit">Save Template</button>
    </form>

    <script>
        // Ensure the script runs after the DOM is loaded
        document.addEventListener("DOMContentLoaded", function () {
            const addSectionBtn = document.getElementById("add-section-btn");
            if (!addSectionBtn) {
                console.error("Add section button not found.");
                return;
            }

            addSectionBtn.addEventListener("click", addSection);
        });

        function addSection() {
            let sectionsContainer = document.getElementById("sections-container");

            if (!sectionsContainer) {
                console.error("Sections container not found.");
                return;
            }

            let sectionDiv = document.createElement("div");
            sectionDiv.classList.add("section-item");

            sectionDiv.innerHTML = `
                <label>Section Name:</label>
                <input type="text" name="section_name[]" required><br>

                <label>Number of Questions:</label>
                <input type="number" name="num_questions[]" required><br>

                <label>Marks per Question:</label>
                <input type="number" name="marks_per_question[]" required><br>

                <label>Instructions:</label>
                <input type="text" name="instructions[]" required><br><br>

                <button type="button" class="remove-section-btn">Remove Section</button><br><br>
            `;

            sectionsContainer.appendChild(sectionDiv);

            // Add event listener to remove section
            sectionDiv.querySelector(".remove-section-btn").addEventListener("click", function () {
                sectionDiv.remove();
            });
        }
    </script>
{% endblock %}
