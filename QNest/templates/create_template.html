{% extends "base.html" %}
{% load static %}
{% block title %}Create Exam Template{% endblock %}

{% block content %}
<link rel="stylesheet" href="{% static 'css/template.css' %}" />

<div class="template-container">
  <h2>Create Exam Template</h2>

  <form method="POST" action="{% url 'create_template' %}" id="template-form">
    {% csrf_token %}

    <div class="form-group">
      <label>Template Name:</label>
      <input type="text" name="template_name" required />
    </div>

    <div class="form-group">
      <label>Exam Title:</label>
      <input type="text" name="exam_title" required />
    </div>

    <div class="form-group">
      <label>Course Code:</label>
      <input type="text" name="course_code" required />
    </div>

    <div class="form-group">
      <label>Course Name:</label>
      <input type="text" name="course_name" required />
    </div>

    <div class="form-group">
      <label>Time Duration:</label>
      <input type="text" name="time_duration" required />
    </div>

    <div class="form-group">
      <label>Max Marks:</label>
      <input type="number" name="max_marks" id="max_marks" required min="1" />
    </div>

    <h3>Sections</h3>
    <div id="sections-container"></div>
    <button type="button" id="add-section-btn">Add Section</button>

    <div id="total-marks-display">Total Marks: 0</div>
    <div id="marks-message" class="error-message"></div>

    <button type="submit">Save Template</button>
  </form>
</div>

<script>
  document.addEventListener("DOMContentLoaded", function () {
    const addSectionBtn = document.getElementById("add-section-btn");
    const form = document.getElementById("template-form");
    const maxMarksInput = document.getElementById("max_marks");
    const totalMarksDisplay = document.getElementById("total-marks-display");
    const marksMessage = document.getElementById("marks-message");

    // Add first section by default
    addSection();

    function validateInstruction(instruction, numQuestions) {
      instruction = instruction.toLowerCase().trim();
      
      if (instruction.startsWith("answer all")) {
        return { valid: true, count: numQuestions };
      }
      else if (instruction.startsWith("answer only")) {
        const parts = instruction.split(" ");
        if (parts.length === 3 && !isNaN(parts[2])) {
          const count = parseInt(parts[2]);
          return { 
            valid: count <= numQuestions, 
            count: Math.min(count, numQuestions) 
          };
        }
      }
      return { valid: false, count: 0 };
    }

    function calculateTotalMarks() {
      let total = 0;
      let allValid = true;
      marksMessage.textContent = "";
      
      document.querySelectorAll(".section-item").forEach(section => {
        const numQuestions = parseInt(section.querySelector("[name='num_questions[]']").value) || 0;
        const marksPerQuestion = parseInt(section.querySelector("[name='marks_per_question[]']").value) || 0;
        const instruction = section.querySelector("[name='instructions[]']").value;
        
        const validation = validateInstruction(instruction, numQuestions);
        const errorEl = section.querySelector(".instruction-error");
        
        if (!validation.valid) {
          errorEl.style.display = "block";
          allValid = false;
          marksMessage.textContent = "Fix all instructions before submitting";
        } else {
          errorEl.style.display = "none";
          total += validation.count * marksPerQuestion;
        }
      });

      totalMarksDisplay.textContent = `Total Marks: ${total}`;
      return { total, allValid };
    }

    function addSection() {
      const sectionDiv = document.createElement("div");
      sectionDiv.className = "section-item";
      sectionDiv.innerHTML = `
        <div class="form-group">
          <label>Section Name:</label>
          <input type="text" name="section_name[]" required>
        </div>

        <div class="form-group">
          <label>Number of Questions:</label>
          <input type="number" name="num_questions[]" required min="1">
        </div>

        <div class="form-group">
          <label>Marks per Question:</label>
          <input type="number" name="marks_per_question[]" required min="1">
        </div>

        <div class="form-group">
          <label>Instructions:</label>
          <input type="text" name="instructions[]" required 
                 placeholder="Answer all or Answer only X">
          <span class="instruction-error">
            Must be "Answer all" or "Answer only X" where X ≤ questions
          </span>
        </div>

        <button type="button" class="remove-section-btn">Remove Section</button>
      `;

      document.getElementById("sections-container").appendChild(sectionDiv);

      // Set initial error state to hidden
      sectionDiv.querySelector(".instruction-error").style.display = "none";

      // Add event listeners
      sectionDiv.querySelectorAll("input").forEach(input => {
        input.addEventListener("input", () => calculateTotalMarks());
      });

      sectionDiv.querySelector(".remove-section-btn").addEventListener("click", () => {
        sectionDiv.remove();
        calculateTotalMarks();
      });
    }

    form.addEventListener("submit", function(e) {
      const maxMarks = parseInt(maxMarksInput.value);
      const { total, allValid } = calculateTotalMarks();

      if (!allValid) {
        e.preventDefault();
        marksMessage.textContent = "Please fix all instruction fields";
        return;
      }

      if (total !== maxMarks) {
        e.preventDefault();
        marksMessage.textContent = `Total marks (${total}) must match max marks (${maxMarks})`;
      }
    });

    addSectionBtn.addEventListener("click", addSection);
  });
</script>
{% endblock %}
