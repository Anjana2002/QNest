<!DOCTYPE html>
<html>
<head>
    <title>Generate Exam Question Paper</title>
    <script>
        function addSection() {
            let sectionDiv = document.createElement("div");
            sectionDiv.innerHTML = `
                <label>Section Name:</label>
                <input type="text" name="section_name[]" required><br>

                <label>Number of Questions:</label>
                <input type="number" name="num_questions[]" required><br>

                <label>Marks per Question:</label>
                <input type="number" name="marks_per_question[]" required><br>

                <label>Instructions:</label>
                <input type="text" name="instructions[]" required><br><br>
            `;
            document.getElementById("sections-container").appendChild(sectionDiv);
        }

        function generateQuestions() {
            let formData = new FormData(document.getElementById("upload-form"));
            formData.append("generate_question_paper", "1");
        
            fetch("{% url 'upload_files' %}", {  // ✅ Correct URL
                method: "POST",
                body: formData,
                headers: {
                    "X-CSRFToken": document.querySelector("[name=csrfmiddlewaretoken]").value
                }
            })
            .then(response => response.text())
            .then(text => {
                console.log("Raw Response:", text);
                try {
                    let data = JSON.parse(text);
                    if (data.error) {
                        alert("Error: " + data.error);
                    } else {
                        document.getElementById("question-paper").textContent = data.question_paper;
                    }
                } catch (error) {
                    console.error("Failed to parse response:", text);
                    alert("Server returned unexpected response");
                }
            })
            .catch(error => {
                console.error("Network Error:", error);
                alert("Network error - check console");
            });
        }
        function generateQuestions() {
            let formData = new FormData(document.getElementById("upload-form"));
        
            fetch("/upload/", {  // Ensure this matches your Django URL
                method: "POST",
                body: formData,
                headers: {
                    "X-CSRFToken": document.querySelector("[name=csrfmiddlewaretoken]").value
                }
            })
            .then(response => {
                console.log("Response status:", response.status);  // Debugging
                if (!response.ok) {
                    return response.text().then(text => {
                        console.error("Server error:", text);  // Debugging
                        throw new Error("Network response was not ok");
                    });
                }
                return response.json();
            })
            .then(data => {
                console.log("Response data:", data);  // Debugging
                if (data.error) {
                    alert(data.error);
                } else {
                    document.getElementById("question-paper").textContent = data.question_paper;
                }
            })
            .catch(error => {
                console.error("Fetch error:", error);  // Debugging
                alert("An error occurred while generating the question paper.");
            });
        } 
        

        function toggleTemplateForm() {
            let form = document.getElementById("new-template-form");
            form.style.display = form.style.display === "none" ? "block" : "none";
        }
    </script>
</head>
<body>
    <h2>Select or Create Exam Template</h2>

    <!-- Select Existing Template -->
    <label>Select a Template:</label>
    <select name="template_id" required>
        {% if templates %}
            {% for template in templates %}
                <option value="{{ template.id }}">{{ template.template_name }}</option>
            {% endfor %}
        {% else %}
            <option value="" disabled>No templates available</option>
        {% endif %}
    </select>
    
        
        <button type="button" onclick="toggleTemplateForm()">Create New Template</button>

        <br><br>

        <!-- File Upload Section -->
        <h2>Upload Study Material and Previous Question Paper</h2>
        <label for="study_material">Study Material PDF:</label>
        <input type="file" id="study_material" name="study_material" accept="application/pdf" required multiple><br><br>

        <label for="previous_question">Previous Question Paper PDF:</label>
        <input type="file" id="previous_question" name="previous_question" accept="application/pdf" required multiple><br><br>

        <button type="button" onclick="generateQuestions()">Generate Question Paper</button>
    </form>

    <!-- New Template Form (Hidden by Default) -->
    <!-- New Template Form -->
<div id="new-template-form" style="display:none;">
    <h2>Create New Template</h2>
    <form method="POST" action="{% url 'upload_files' %}">
        {% csrf_token %}
        <input type="hidden" name="create_template" value="1">

        <label>Template Name:</label>
        <input type="text" name="template_name" required><br>

        <label>Exam Title:</label>
        <input type="text" name="exam_title" required><br>

        <label>Course Code:</label>
        <input type="text" name="course_code" required><br>

        <label>Course Name:</label>
        <input type="text" name="course_name" required><br>

        <label>Time Duration:</label>
        <input type="text" name="time_duration" required><br>

        <label>Max Marks:</label>
        <input type="number" name="max_marks" required><br>

        <h3>Sections</h3>
        <div id="sections-container"></div>
        <button type="button" onclick="addSection()">Add Section</button><br><br>

        <button type="submit">Save Template</button>
    </form>
</div>


    <!-- Generated Question Paper -->
    <h2>Generated Question Paper:</h2>
    <pre id="question-paper"></pre>

</body>
</html>
