{% extends "base.html" %}
{% block content %}
<h2>Generate Question Paper</h2>
<form method="post" enctype="multipart/form-data">
    {% csrf_token %}
    <div class="form-group">
        <label for="template_id">Select Template:</label>
        <select class="form-control" id="template_id" name="template_id" required>
            {% for template in templates %}
            <option value="{{ template.id }}">{{ template.exam_title }}</option>
            {% endfor %}
        </select>
    </div>
    
    <div class="form-group">
        <label for="study_material">Study Material (PDF):</label>
        <input type="file" class="form-control-file" id="study_material" name="study_material" accept=".pdf" multiple required>
    </div>
    
    <div class="form-group">
        <label for="previous_question">Previous Questions (PDF, optional):</label>
        <input type="file" class="form-control-file" id="previous_question" name="previous_question" accept=".pdf" multiple>
    </div>
    
    <button type="submit" name="generate_question_paper" class="btn btn-primary">Generate Question Paper</button>
</form>

{% if generated_questions %}
<div class="mt-4">
    <h3>Generated Questions</h3>
    <pre>{{ generated_questions }}</pre>
    
    {% if pdf_preview_available %}
    <div class="mt-4">
        <h4>PDF Preview</h4>
        <div class="embed-responsive embed-responsive-16by9">
            <embed class="embed-responsive-item" 
                   src="data:application/pdf;base64,{{ request.session.pdf_preview }}#toolbar=0&navpanes=0&scrollbar=0"
                   type="application/pdf">
        </div>
        <a href="{% url 'download_generated_pdf' %}" class="btn btn-success mt-3">
            Download PDF
        </a>
    </div>
    {% endif %}
</div>
{% endif %}
{% endblock %}
