{% extends "base.html" %}

{% block title %}Upload Exam Materials{% endblock %}

{% block content %}
    <h2>Select Exam Template & Upload Study Materials</h2>

    <!-- Form for Uploading Documents -->
    <form id="upload-form" method="POST" enctype="multipart/form-data">
        {% csrf_token %}

        <!-- Select Existing Template -->
        <label>Select a Template:</label>
        <select name="template_id" required>
            {% if templates %}
                {% for template in templates %}
                    <option value="{{ template.id }}">{{ template.template_name }}</option>
                {% endfor %}
            {% else %}
                <option value="" disabled>No templates available</option>
            {% endif %}
        </select>

        <br><br>

        <!-- File Upload Section -->
        <h2>Upload Study Material and Previous Question Paper</h2>
        <label for="study_material">Study Material PDF:</label>
        <input type="file" id="study_material" name="study_material" accept="application/pdf" required multiple><br><br>

        <label for="previous_question">Previous Question Paper PDF:</label>
        <input type="file" id="previous_question" name="previous_question" accept="application/pdf" required multiple><br><br>

        <button type="submit">Generate Question Paper</button>
    </form>
{% endblock %}
